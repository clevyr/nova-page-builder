laravel: '@testbench'

env:
  - APP_URL=http://localhost:8000

providers:
  # Inertia\ServiceProvider is normally auto-discovered, but Nova's own service
  # provider registers Inertia bindings, so explicitly listing it here ensures
  # ordering across testbench bootstraps. Remove if Nova ever stops shipping
  # Inertia as a transitive dep.
  - Inertia\ServiceProvider
  - Laravel\Nova\NovaServiceProvider
  - Laravel\Nova\NovaCoreServiceProvider
  - Workbench\App\Providers\NovaServiceProvider
  - Outl1ne\MenuBuilder\MenuBuilderServiceProvider
  - Clevyr\NovaPageBuilder\NovaPageBuilderServiceProvider

migrations: true

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: /nova
  build:
    - package:discover
    - asset-publish
    - create-sqlite-db
    - db:wipe
    - migrate:fresh
    - storage:link
  assets:
    - nova-assets
    - clevyr-nova-page-builder-tinymce
  discovers:
    web: true
    api: false
    views: true
    config: true
    commands: false
    factories: true
  sync:
    - from: public
      to: public/vendor/nova
    - from: storage
      to: workbench/storage

  purge:
    directories:
      - lang/*
      # Only wipe Nova's own published assets between composer runs; the
      # `clevyr-nova-page-builder-tinymce` publish output otherwise gets nuked
      # on every `post-autoload-dump` and the TinyMCE editor falls back to its
      # cloud loader (with the API-key nag) until the next `composer build`.
      - public/vendor/nova/*
